# Spielt die Server-Funktion "push" (Mitteilungen an Super-User) nach Supabase aus.
# Beim ersten Lauf wird ein VAPID-Schlüsselpaar erzeugt und direkt als Supabase-Secret
# gespeichert – es taucht nirgends sonst auf. Spätere Läufe lassen die Schlüssel unverändert
# (neue Schlüssel würden alle eingeschalteten Mitteilungen ungültig machen).
# Braucht das Repo-Secret SUPABASE_ACCESS_TOKEN (EINRICHTUNG.md, Teil I).
name: Mitteilungen ausspielen
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/push.yml"]
  workflow_dispatch:
concurrency:
  group: push-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: nwrkrotxhgtxtshprfur
      CLI: supabase@3.1.0
    steps:
      - name: Zugang vorhanden?
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN fehlt noch – übersprungen. Siehe EINRICHTUNG.md, Teil I."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22
      - name: Schlüssel anlegen (nur beim ersten Mal)
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -euo pipefail
          list=$(npx -y "$CLI" secrets list --remote="$REF" --yes)
          if echo "$list" | grep -q VAPID_PRIVATE_KEY; then
            echo "VAPID-Schlüssel vorhanden – bleiben unverändert."
            exit 0
          fi
          umask 077
          node -e '
            const c = require("crypto");
            const { publicKey, privateKey } = c.generateKeyPairSync("ec", { namedCurve: "prime256v1" });
            const p = publicKey.export({ format: "jwk" }), k = privateKey.export({ format: "jwk" });
            const raw = Buffer.concat([Buffer.from([4]), Buffer.from(p.x, "base64url"), Buffer.from(p.y, "base64url")]).toString("base64url");
            console.log("::add-mask::" + k.d);
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/vapid.env",
              "VAPID_PUBLIC_KEY=" + raw + "\nVAPID_PRIVATE_KEY=" + k.d + "\nVAPID_SUBJECT=mailto:casalapaz.vinaros@gmail.com\n");
          '
          npx -y "$CLI" secrets set --remote="$REF" --env-file "$RUNNER_TEMP/vapid.env" --yes
          rm -f "$RUNNER_TEMP/vapid.env"
          echo "Neue VAPID-Schlüssel gespeichert."
      - name: Funktion ausspielen
        if: steps.gate.outputs.go == 'yes'
        run: npx -y "$CLI" functions deploy push --remote="$REF" --no-verify-jwt --use-api --yes
      - name: Prüfen
        if: steps.gate.outputs.go == 'yes'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" "https://$REF.supabase.co/functions/v1/push" || true)
            echo "Versuch $i: HTTP $code $(cat /tmp/r.json 2>/dev/null)"
            [ "$code" = "200" ] && grep -q publicKey /tmp/r.json && exit 0
            sleep 10
          done
          exit 1
