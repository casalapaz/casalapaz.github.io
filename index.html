<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A22" media="(prefers-color-scheme: dark)">
<title>Casa la Paz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa la Paz">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Casa la Paz – Belegungsplan
   Grund: kühler Kalkputz. Schrift: Tinte (Nachtmeer). Drei Stammfarben: Mar, Granada, Olivo.
   Schrift: SF Pro (iPhone) für alles, Titel fett und eng; Geist als Ersatz auf anderen Geräten.
   Layout: Übersicht als Kacheln auf einem Bildschirm; Kalender ein Monat pro Seite, seitlich wischen mit Einrasten. */
:root {
  --ground: #EDF0EF;
  --surface: #FFFFFF;
  --surface-2: #F4F6F5;
  --well: #E3E8E7;
  --ink: #15232E;
  --ink-2: rgba(21, 35, 46, 0.64);
  --ink-3: rgba(21, 35, 46, 0.40);
  --line: rgba(21, 35, 46, 0.08);
  --line-2: rgba(21, 35, 46, 0.14);
  --micha: #1F5AA6;
  --uli: #B23440;
  --fanny: #6B8733;
  --micha-soft: #DCE6F3;
  --uli-soft: #F3DFE0;
  --fanny-soft: #E5ECD8;
  --azahar: #C98A0E;
  --f-NRW: #7C8CA0;
  --f-HE: #B08A57;
  --f-HH: #4F9A97;
  --ok: #2F7D5B;
  --sol: #D9822B;
  --alert: #FF3B30;   /* iOS-Rot, nur für Zähler */
  --behind: #0E1820;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(21,35,46,.05), 0 8px 24px -12px rgba(21,35,46,.18);
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Helvetica Neue", Arial, sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1A22; --surface: #17242E; --surface-2: #1C2B36; --well: #22323E;
    --ink: #ECF0F1; --ink-2: rgba(236, 240, 241, 0.66); --ink-3: rgba(236, 240, 241, 0.40);
    --line: rgba(236, 240, 241, 0.08); --line-2: rgba(236, 240, 241, 0.15);
    --micha: #5B90D6; --uli: #D9616B; --fanny: #98B45E;
    --micha-soft: rgba(91,144,214,.2); --uli-soft: rgba(217,97,107,.2); --fanny-soft: rgba(152,180,94,.2);
    --azahar: #E3AE45; --behind: #03080C; --sol: #F0A04E; --alert: #FF453A;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F1A22; --surface: #17242E; --surface-2: #1C2B36; --well: #22323E;
  --ink: #ECF0F1; --ink-2: rgba(236, 240, 241, 0.66); --ink-3: rgba(236, 240, 241, 0.40);
  --line: rgba(236, 240, 241, 0.08); --line-2: rgba(236, 240, 241, 0.15);
  --micha: #5B90D6; --uli: #D9616B; --fanny: #98B45E;
  --micha-soft: rgba(91,144,214,.2); --uli-soft: rgba(217,97,107,.2); --fanny-soft: rgba(152,180,94,.2);
  --azahar: #E3AE45; --behind: #03080C; --sol: #F0A04E; --alert: #FF453A;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--behind); color: var(--ink); font-family: var(--ui); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--micha); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.s-micha { --c: var(--micha); --cs: var(--micha-soft); }
.s-uli { --c: var(--uli); --cs: var(--uli-soft); }
.s-fanny { --c: var(--fanny); --cs: var(--fanny-soft); }

/* ---------- Frame ---------- */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--ground); transform-origin: 50% 0; overflow: hidden;
  transition: transform .5s var(--ease), border-radius .5s var(--ease), filter .5s var(--ease); }
body.sheet-up .app { transform: translateY(calc(var(--sat) + 10px)) scale(.93); border-radius: 22px; filter: brightness(.92); }
body.sheet-drag .app { transition: none; }
.stage { flex: 1; position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: calc(var(--sat) + 12px) 20px 20px; }
.view[hidden] { display: none !important; }
.view.enter { animation: enter .35s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.wordmark { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.wordmark small { font-family: var(--ui); font-size: 13px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; margin-left: 6px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 600; color: #fff; background: var(--c, var(--ink)); flex: none;
  box-shadow: 0 0 0 2px var(--ground), 0 0 0 3px var(--line-2); transition: transform .2s var(--spring); }
.avatar:active { transform: scale(.9); }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.06; letter-spacing: -.035em; margin: 10px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 650; font-size: 22px; letter-spacing: -.025em; margin: 0; line-height: 1.15; text-wrap: balance; }
.lead { color: var(--ink-2); margin: 6px 0 0; font-size: 16px; line-height: 1.35; }
.section { margin-top: 30px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.panel { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 17px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-align: center; text-decoration: none; transition: transform .18s var(--spring), opacity .2s, background .2s; }
.btn:active { transform: scale(.97); }
.btn-ink { background: var(--ink); color: var(--ground); }
.btn-c { background: var(--c); color: #fff; }
.btn-soft { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn-danger { background: transparent; color: var(--uli); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--uli) 40%, transparent); }
.btn-wide { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); flex: none; transition: transform .2s var(--spring), opacity .2s; }
.icon-btn:active { transform: scale(.9); }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip-ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.chip-wait { background: color-mix(in srgb, var(--azahar) 18%, transparent); color: color-mix(in srgb, var(--azahar) 70%, var(--ink)); }
.chip-no { background: color-mix(in srgb, var(--uli) 13%, transparent); color: var(--uli); }
.chip-off { background: var(--surface-2); color: var(--ink-3); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip-wait .dot { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .25; } }

/* ---------- Home: one screen of tiles ---------- */
#v-home { padding: calc(var(--sat) + 10px) 16px 12px; }
.home { height: 100%; min-height: 430px; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px; }
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }
.hello h1 { margin: 0; font-size: 30px; }
.status { margin: 2px 0 0; font-size: 14.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hello > div { min-width: 0; }
.hello-req { padding: 0; min-height: 44px; }
.hello-req h1 { font-size: 30px; }
.hero { display: block; width: 100%; padding: 14px 16px 13px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, var(--cs, transparent) 0%, transparent 65%); pointer-events: none; }
.hero > * { position: relative; }
.hero-k { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
.hero-date { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.03em; margin-top: 4px; }
.hero-meta { color: var(--ink-2); margin-top: 3px; font-size: 14.5px; }
.hero:active, .tile:active { transform: scale(.98); }
.hero, .tile { transition: transform .25s var(--spring); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
.tile { display: flex; flex-direction: column; justify-content: space-between; padding: 14px 14px 13px; min-height: 0; overflow: hidden; position: relative; }
.tile-t { font-weight: 650; font-size: 17px; letter-spacing: -.015em; display: flex; justify-content: space-between; align-items: center; }
.tile-t svg { color: var(--ink-3); }
.tile-s { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.3; }
.tile-big { font-family: var(--display); font-weight: 700; font-size: 44px; letter-spacing: -.04em; line-height: 1; }
.tile-badge { position: absolute; top: 14px; right: 14px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--alert); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.mini-month { flex: 1; min-height: 0; max-height: 96px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(var(--r), minmax(0, 1fr)); gap: 3px; margin-top: 8px; }
.mini-month i { border-radius: 3px; background: var(--well); }
.mini-month i.x { visibility: hidden; }
.mini-month i.b { background: var(--c); }
.mini-month i.p { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--c); }
.mini-month i.t { box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3px var(--ink); }
.mini-year { display: grid; grid-template-rows: repeat(12, minmax(0, 1fr)); gap: 2px; margin-top: 8px; flex: 1; min-height: 0; max-height: 100px; }
.mini-year span { display: grid; grid-template-columns: repeat(31, 1fr); gap: 1px; }
.mini-year i { border-radius: 1px; background: var(--well); }
.mini-year i.x { visibility: hidden; }
.mini-year i.b { background: var(--c); }
.mini-year i.p { background: color-mix(in srgb, var(--c) 45%, transparent); }
.ring-wrap { display: flex; align-items: center; gap: 12px; }
.ring { width: 66px; height: 66px; flex: none; }
.ring .bg { stroke: var(--well); }
.ring .fg { stroke: var(--c); transition: stroke-dashoffset 1s var(--ease); }
.ring .pd { stroke: color-mix(in srgb, var(--c) 35%, transparent); }
.ring text { font-family: var(--display); font-weight: 700; font-size: 19px; fill: var(--ink); letter-spacing: -.03em; }
.ring text.rl { font-family: var(--ui); font-size: 9.5px; font-weight: 600; fill: var(--ink-3); letter-spacing: 0; }
.ring { width: 64px; height: 64px; }
@media (max-height: 640px) { .ring { width: 52px; height: 52px; } .tile-big { font-size: 34px; } .tile-s { font-size: 12.5px; } }
@media (max-height: 600px) { .tile .sub { display: none; } .hero-k span:first-child { font-size: 13px; } .mini-month { gap: 2px; } .tile { padding: 12px 13px 11px; } }
.cta { min-height: 52px; }

/* ---------- Calendar: one month per page ---------- */
#v-cal { overflow: hidden; display: flex; flex-direction: column; padding: calc(var(--sat) + 10px) 0 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 0 20px; min-height: 58px; }
.cal-title { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -.04em; line-height: 1.05; white-space: nowrap; }
.cal-title .y { color: var(--ink-3); font-weight: 600; }
.cal-sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-btn { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 20px; min-width: 112px; justify-content: center; border-radius: 999px; background: var(--ink); color: var(--ground); font-size: 16px; font-weight: 600; box-shadow: 0 8px 18px -10px rgba(0,0,0,.5); transition: transform .2s var(--spring), opacity .3s, background .3s, color .3s; flex: none; }
.today-btn:active { transform: scale(.94); }
.today-btn { font-size: 17px; font-weight: 650; background: var(--micha); color: #fff; box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--micha) 80%, transparent); }
.today-btn .ar { display: inline-grid; width: 18px; transition: transform .35s var(--spring), opacity .25s, width .3s var(--ease); }
.today-btn.here { background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
.today-btn.here .ar { opacity: 0; width: 0; transform: scale(.4); }
.today-btn.r { flex-direction: row-reverse; }
.wd { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 13px; font-weight: 600; color: var(--ink-3); text-align: center; padding: 8px 12px 6px; }
.wd span:nth-child(n+6) { color: color-mix(in srgb, var(--ink-3) 70%, transparent); }
.pager { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scrollbar-width: none; min-height: 0; }
.pager::-webkit-scrollbar { display: none; }
.pager.jump { animation: jump .35s var(--ease); }
@keyframes jump { from { opacity: .2; transform: scale(.985); } }
.mpage { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; padding: 0 12px; min-height: 0; }
.mgrid { flex: 1; display: grid; grid-template-rows: repeat(var(--rows), 1fr); min-height: 0; }
.wk { position: relative; border-top: 1px solid var(--line); min-height: 0; overflow: hidden; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.c { position: relative; display: flex; justify-content: center; align-items: flex-start; padding-top: 6px; transition: background .25s; }
.c.blank { pointer-events: none; }
.c .n { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; transition: background .2s, color .2s, transform .25s var(--spring); }
.c:active .n { transform: scale(.86); }
.c.we .n { color: var(--ink-2); }
.c.past .n { color: var(--ink-3); }
.c.hol .n { font-weight: 700; }
.c.today .n { background: var(--ink); color: var(--ground); font-weight: 700; }
.legend i.hsl { height: 3px; border-radius: 2px; background: var(--sol); }
.c.nogo { opacity: .28; }
.c.in { background: color-mix(in srgb, var(--me) 13%, transparent); }
.c.sel-a, .c.sel-b { background: color-mix(in srgb, var(--me) 13%, transparent); }
.c.sel-a { border-radius: 16px 0 0 16px; }
.c.sel-b { border-radius: 0 16px 16px 0; }
.c.sel-a.sel-b { border-radius: 16px; }
.c.sel-a .n, .c.sel-b .n { background: var(--me); color: #fff; font-weight: 700; }
.c.solo { border-radius: 16px; }
.c.pick .n { animation: pick .45s var(--spring); }
@keyframes pick { 40% { transform: scale(1.22); } }
.hols { position: absolute; left: 0; right: 0; top: 41px; height: 17px; pointer-events: none; }
.hl { position: absolute; top: 0; height: 17px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 6px; background: var(--well); color: var(--ink-2); font-size: 10.5px; font-weight: 600; white-space: nowrap; letter-spacing: -.01em; }
.hl.r { transform: translateX(-100%); }
.bars { position: absolute; left: 0; right: 0; top: 43px; pointer-events: none; }
.bars.has-h { top: 61px; }
.bar { position: absolute; height: 26px; background: var(--c); color: #fff; font-size: 13.5px; font-weight: 650; line-height: 26px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; letter-spacing: -.01em; }
.bar.ra { border-top-left-radius: 13px; border-bottom-left-radius: 13px; }
.bar.rb { border-top-right-radius: 13px; border-bottom-right-radius: 13px; }
.bar.pend { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 34%, var(--surface)) 0 5px, color-mix(in srgb, var(--c) 18%, var(--surface)) 5px 10px); color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
.bar.grow { animation: grow .7s var(--ease) both; }
@keyframes grow { from { clip-path: inset(0 100% 0 0 round 12px); } to { clip-path: inset(0 0 0 0 round 0); } }
.hsl-line { position: absolute; top: 0; height: 3px; background: var(--sol); pointer-events: none; z-index: 1; }
.hsl-line.a { border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
.hsl-line.b { border-top-right-radius: 2px; border-bottom-right-radius: 2px; }
.fer { position: absolute; left: 0; right: 0; bottom: 9px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
.fl { position: relative; height: 3px; }
.fseg { position: absolute; top: 0; height: 4px; background: radial-gradient(circle, var(--ink-3) 1.5px, transparent 2px) 0 50% / 8px 4px repeat-x; }
.mfoot { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 4px 10px; min-height: 60px; }
.fnote { flex: 1; font-size: 12.5px; line-height: 1.35; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; justify-content: center; text-align: center; }
.fnote span { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.fnote i { width: 20px; height: 4px; background: radial-gradient(circle, var(--ink-3) 1.5px, transparent 2px) 0 50% / 8px 4px repeat-x; display: inline-block; }
.fnote b { font-weight: 600; color: var(--ink-2); }

/* Selection bar */
.selbar { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 9; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; border-radius: 20px;
  background: var(--ink); color: var(--ground); box-shadow: 0 18px 40px -14px rgba(0,0,0,.55);
  transform: translateY(24px) scale(.97); opacity: 0; visibility: hidden; pointer-events: none; transition: transform .45s var(--ease), opacity .3s, visibility 0s .45s; }
.selbar.on { transform: none; opacity: 1; visibility: visible; pointer-events: auto; transition: transform .45s var(--spring), opacity .3s, visibility 0s; }
.selbar p { margin: 0; flex: 1; font-size: 16px; line-height: 1.3; font-weight: 600; }
.selbar p small { display: block; font-weight: 400; opacity: .7; font-size: 14px; margin-top: 1px; }
.selbar button { height: 42px; padding: 0 14px; border-radius: 13px; background: color-mix(in srgb, var(--ground) 16%, transparent); font-size: 15px; font-weight: 600; flex: none; }

/* ---------- Requests ---------- */
.req-list { padding: 4px 16px; }
.req { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 16px 0; align-items: start; }
.req + .req { border-top: 1px solid var(--line); }
.req .avatar { width: 40px; height: 40px; box-shadow: none; }
.req-name { font-weight: 600; }
.req-date { font-family: var(--display); font-weight: 650; font-size: 18px; letter-spacing: -.025em; margin-top: 1px; }
.req-meta { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.req-actions { display: flex; gap: 8px; margin-top: 12px; }
.req-actions .btn { min-height: 44px; border-radius: 13px; font-size: 15px; padding: 0 16px; flex: 1; }
.reason { margin-top: 8px; font-size: 14px; color: var(--ink-2); padding-left: 10px; border-left: 2px solid var(--line-2); font-style: italic; }

(() => {
"use strict";

/* ===================== LOGIC START ===================== */
const FREE_NIGHTS = 21;
const RATE = 200 / 7;
const EXPIRY_DAYS = 21;
const MAX_NIGHTS = 31;
const DAY = 864e5;
const STAMME = ["micha", "uli", "fanny"];

const p2 = n => String(n).padStart(2, "0");
const D = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const S = t => { const x = new Date(t); return x.getUTCFullYear() + "-" + p2(x.getUTCMonth() + 1) + "-" + p2(x.getUTCDate()); };
const addDays = (s, n) => S(D(s) + n * DAY);
const diffDays = (a, b) => Math.round((D(b) - D(a)) / DAY);

/* What a planned stay adds for its Stamm: new nights (union), extra paid nights, cost, free nights left. */

    const after = stammNights(bookings, draft.stamm, y, ["confirmed", "pending"], draft).size;

  if (!statuses.includes(b.status)) return 0;
  const mine = bookings.filter(x => x.stamm === b.stamm && statuses.includes(x.status));
  const order = (x, y) => x.from < y.from ? -1 : x.from > y.from ? 1 : x.createdAt - y.createdAt;
  let count = 0;
  for (const y of new Set(nightsOf(b).map(n => n.slice(0, 4)))) {
    const nights = [...stammNights(bookings, b.stamm, y, statuses)].sort();
    nights.forEach((n, i) => {
      if (i < FREE_NIGHTS) return;
      const owner = mine.filter(x => x.from <= n && n < x.to).sort(order)[0];
      if (owner && owner.id === b.id) count++;

  }
  return count;
}

}

/* ---------- Echtzeit: Änderungen anderer erscheinen ohne Neustart ----------
   1. Live-Verbindung zu Supabase Realtime (WebSocket, Phoenix-Protokoll, ohne Bibliothek):
      jede Änderung an „bookings“ löst ein Nachladen aus (≈ 1 s). Was in der Tabelle steht,
      prüft der Server über dieselben Leserechte wie beim normalen Laden.
   2. Rückfall: Abfrage alle 15 s, solange die Live-Verbindung nicht steht (sonst alle 60 s).
   3. Beim Zurückkehren in die App und bei eingehender Mitteilung: sofort nachladen. */

  ws: null, joined: false, live: false, ref: 0, hb: null, retry: 0, again: null, soonT: null, token: null,
  topic: "realtime:casa-bookings",
  url: () => LIVE.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(LIVE.key) + "&vsn=1.0.0",
  start() {
    if (!IS_LIVE || !sb.session || this.ws || !("WebSocket" in window) || document.visibilityState === "hidden") return;
    clearTimeout(this.again);
    let ws;
    try { ws = new WebSocket(this.url()); } catch (e) { return this.later(); }
    this.ws = ws;
    ws.onopen = () => {
      this.token = sb.session && sb.session.access_token;
      this.send(this.topic, "phx_join", {
        config: { broadcast: { ack: false, self: false }, presence: { key: "" }, private: false,
                  postgres_changes: [{ event: "*", schema: "public", table: "bookings" }] },
        access_token: this.token

      this.hb = setInterval(() => this.beat(), window.CASA_HB_MS || 25e3);
    };

    ws.onclose = () => { if (this.ws !== ws) return; this.reset(); this.later(); };

  on(m) {

      else if (m.payload.status === "error") this.ws && this.ws.close();
    } else if (m.event === "system" && m.payload) {
      if (m.payload.extension === "postgres_changes") this.live = m.payload.status === "ok";

  send(topic, event, payload) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify({ topic, event, payload, ref: String(++this.ref) })); },
  async beat() {
    this.send("phoenix", "heartbeat", {});

    const t = sb.session && sb.session.access_token;
    if (t && t !== this.token && this.joined) { this.token = t; this.send(this.topic, "access_token", { access_token: t }); }
  },
  soon() { clearTimeout(this.soonT); this.soonT = setTimeout(() => syncQuiet(), 250); },
  reset() { clearInterval(this.hb); this.ws = null; this.joined = false; this.live = false; },
  later() {

  if (!IS_LIVE || !sb.session || document.visibilityState === "hidden" || !db) return;
  if (Date.now() - lastSync > (rt.live ? POLL_LIVE_MS() : POLL_MS())) syncQuiet();

/* ---------- Mitteilungen ----------

  /* Beim Start: Service Worker anmelden, Abo der angemeldeten Person zuordnen, Schlüssel vorladen

  async loadKey() {

  /* Muss direkt aus einem Tipp kommen: die erste iOS-Abfrage startet ohne vorheriges await. */

    if (st === "unsupported") return Promise.reject(fail("Dafür braucht das iPhone iOS 16.4 oder neuer (Einstellungen › Allgemein › Softwareupdate).", { mine: true }));

  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800);
}

/* ---------- Tabs ---------- */
function setTab(tab, opts = {}) {
  const changed = tab !== state.tab;
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  ["home", "cal", "req"].forEach(v => { const el = document.getElementById("v-" + v); el.hidden = v !== tab; if (v === tab && changed) { el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); } });
  if (tab !== "cal") clearSel();
  render(opts);
  try { history.replaceState(null, "", "#" + ({ home: "uebersicht", cal: "kalender", req: "anfragen" })[tab]); } catch (e) {}
}
function render(opts = {}) {
  renderBadge();
  if (state.tab === "home") renderHome();
  if (state.tab === "cal") renderCal(opts);
  if (state.tab === "req") renderReq();
}

/* ---------- Home ---------- */
function nextStayFor(u) {
  return db.bookings.filter(b => isActive(b) && b.to > TODAY && (b.by === u.id || b.with.includes(u.id))).sort((a, b) => a.from < b.from ? -1 : 1)[0] || null;
}
function heroChip(b) {
  return b.status === "pending" ? '<span class="chip chip-wait"><span class="dot"></span>Freigabe offen</span>' : '<span class="chip chip-ok"><span class="dot"></span>Bestätigt</span>';
}
function houseLine() {
  const now = db.bookings.find(b => isActive(b) && b.from <= TODAY && TODAY < b.to);
  if (now) return `Gerade im Haus: ${esc(person(now.by).name)}, bis ${fmtDay(now.to, false, false)}`;
  const nxt = db.bookings.filter(b => isActive(b) && b.from > TODAY).sort((a, b) => a.from < b.from ? -1 : 1)[0];
  if (nxt) return `Haus frei bis ${fmtDay(nxt.from, false, false)}, dann ${esc(person(nxt.by).name)}`;
  return "Das Haus ist frei";
}
function renderHome() {

  const quotaSub = q.paid ? `<b>${nights(q.paid)}</b> darüber<br>${eur(q.cost)}` : q.pending ? `+${q.pending} angefragt` : `von ${FREE_NIGHTS}`;

/* ---------- Year + quota sheets ---------- */
function yearGridHTML(y) {
  let rows = "";
  for (let m = 0; m < 12; m++) {
    let cells = ""; const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    for (let d = 1; d <= 31; d++) {
      if (d > dim) { cells += `<i class="yc none"></i>`; continue; }
      const iso = `${y}-${p2(m + 1)}-${p2(d)}`, o = nightOwner(iso), cls = ["yc"];
      if (iso < TODAY) cls.push("past"); if (iso === TODAY) cls.push("today");
      if (o) cls.push("b", "s-" + o.stamm, o.status === "pending" ? "pend" : "");
      if (isHighSeason(iso)) cls.push("hs");
      cells += `<i class="${cls.join(" ")}" style="--m:${m};--d:${d}"></i>`;
    }
    rows += `<span class="ym">${MON_S[m].replace(".", "")}</span><button class="yrow" data-month="${y}-${p2(m + 1)}" aria-label="${MONTHS[m]} ${y} öffnen">${cells}</button>`;
  }
  return `<div class="ygrid">${rows}</div>`;
}

function quotaRow(s, y) {
  const q = quota(db.bookings, s, y);
  let ticks = ""; for (let i = 0; i < FREE_NIGHTS; i++) ticks += `<i class="tick ${i < q.free ? "on" : i < q.projected ? "pend" : ""}"></i>`;
  const left = FREE_NIGHTS - q.free;
  const foot = q.paid ? `<span class="q-over"><b>${nights(q.paid)}</b> darüber</span><span><b class="num">${eur(q.cost)}</b></span>`
    : `<span>${left ? `noch <b>${nights(left)}</b> frei` : "Freinächte aufgebraucht"}</span><span class="num">${eur(0)}</span>`;
  const pend = q.pending ? `<span class="faint" style="font-size:13px;font-weight:500"> + ${q.pending} angefragt</span>` : "";
  return `<div class="q s-${s}"><span class="q-name">${STAMM_NAME[s]}${pend}</span><span class="q-num num">${q.nights}<small> Nächte</small></span><div class="ticks" aria-hidden="true">${ticks}</div><div class="q-foot">${foot}</div></div>`;
}
function openQuota() {

/* ---------- Calendar ---------- */
const pagerEl = () => document.getElementById("pager");
function renderCal(opts = {}) {
  const v = document.getElementById("v-cal"), u = me();
  v.style.setProperty("--me", `var(--${u.stamm})`);
  if (opts.month) state.calIdx = Math.max(0, MONTH_LIST.indexOf(opts.month));
  v.innerHTML = `<div class="cal-head"><div style="min-width:0"><div class="cal-title" id="cal-title"></div><div class="cal-sub" id="cal-sub">Tippe auf einen freien Tag</div></div>
      <button class="today-btn" data-act="today" aria-label="Zum aktuellen Monat"><span class="ar" aria-hidden="true"></span>Heute</button></div>
    <div class="wd">${WD.map(w => `<span>${w}</span>`).join("")}</div>
    <div class="pager" id="pager">${MONTH_LIST.map(monthPage).join("")}</div>`;
  const pg = pagerEl();
  pg.scrollLeft = state.calIdx * pg.clientWidth;
  requestAnimationFrame(() => { pg.scrollLeft = state.calIdx * pg.clientWidth; });
  pg.addEventListener("scroll", onPagerScroll, { passive: true });
  if ("onscrollend" in window) pg.addEventListener("scrollend", onPagerSettle);
  updateCalHead();
  paintSel();
  if (state.growId) { const id = state.growId; state.growId = null; v.querySelectorAll(`.bar[data-open="${id}"]`).forEach((b, i) => { b.style.animationDelay = (150 + i * 120) + "ms"; b.classList.add("grow"); }); }
}
function monthPage(ym, idx) {
  const [y, m] = ym.split("-").map(Number);
  const first = `${ym}-01`, dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cells = []; for (let i = 0; i < weekday(first); i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(`${ym}-${p2(d)}`);
  while (cells.length % 7) cells.push(null);
  const hol = new Map(holidays(y).map(h => [h.date, h]));
  let weeks = ""; for (let w = 0; w < cells.length; w += 7) weeks += weekRow(cells.slice(w, w + 7), hol);
  return `<section class="mpage" data-ym="${ym}" aria-label="${MONTHS[m - 1]} ${y}">
    <div class="mgrid" style="--rows:${cells.length / 7}">${weeks}</div>
    <div class="mfoot"><button class="icon-btn" data-nav="-1" aria-label="Vorheriger Monat" ${idx === 0 ? "disabled" : ""}>${chev(-1)}</button>
      <div class="fnote">${ferienNote(ym)}</div>
      <button class="icon-btn" data-nav="1" aria-label="Nächster Monat" ${idx === MONTH_LIST.length - 1 ? "disabled" : ""}>${chev(1)}</button></div></section>`;
}
function ferienNote(ym) {
  const a = `${ym}-01`, [y, m] = parts(a), b = `${ym}-${p2(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;
  const out = [];
  for (const st of ["NRW", "HE", "HH"]) for (const f of FERIEN[st]) if (f[0] <= b && f[1] >= a) {
    const range = f[0] === f[1] ? dm(f[0]) : `${dm(f[0])}–${dm(f[1])}`;
    out.push(`<span>${STATE_NAME[st]} ${range}</span>`);
  }
  return out.length ? `<span><i></i><b>Schulferien</b></span>${out.join("")}` : `<span class="faint">Keine Schulferien in NRW, Hessen, Hamburg</span>`;
}
function weekRow(cells, hol) {
  const real = cells.map((d, i) => d ? i : -1).filter(i => i >= 0);
  const c0 = real[0], c1 = real[real.length - 1], d0 = cells[c0], d1 = cells[c1];
  const days = cells.map((d, i) => {
    if (!d) return `<span class="c blank"></span>`;
    const cls = ["c"]; if (i >= 5) cls.push("we"); if (d < TODAY) cls.push("past"); if (d === TODAY) cls.push("today");
    const h = hol.get(d); if (h) cls.push("hol");
    const hsd = isHighSeason(d);
    if (hsd) cls.push("hs");
    const label = fmtDay(d) + (h ? `, ${h.name}${h.only ? " (" + h.only + ")" : ""}` : "") + (hsd ? ", Hochsaison" : "");
    return `<button class="${cls.join(" ")}" data-day="${d}" aria-label="${esc(label)}"><span class="n">${Number(d.slice(8))}</span></button>`;
  }).join("");
  // Holidays (consecutive days merged)
  let hols = "";
  const hs = cells.map((d, i) => d && hol.get(d) ? { i, h: hol.get(d) } : null).filter(Boolean);
  for (let k = 0; k < hs.length; k++) {
    const a = hs[k]; let b = a;
    while (k + 1 < hs.length && hs[k + 1].i === b.i + 1) b = hs[++k];
    const name = a !== b ? (a.h.name.includes("Weihnachtstag") ? "Weihnachten" : a.h.short + " / " + b.h.short) : a.h.short + (a.h.only ? " (" + a.h.only + ")" : "");
    const right = a.i >= 4;
    hols += `<span class="hl ${right ? "r" : ""}" style="left:calc(${(right ? b.i + 1 : a.i) / 7 * 100}% ${right ? "- 3px" : "+ 3px"})">${esc(name)}</span>`;
  }
  // Booking bars: from the middle of the arrival day to the middle of the departure day
  const segs = [];
  for (const b of db.bookings) {
    if (!isActive(b) || b.to < d0 || b.from > d1) continue;
    const start = b.from >= d0 ? c0 + diffDays(d0, b.from) + .5 : c0;
    const end = b.to <= d1 ? c0 + diffDays(d0, b.to) + .5 : c1 + 1;
    if (end - start <= 0) continue;
    segs.push({ b, start, end, ra: b.from >= d0, rb: b.to <= d1 });
  }
  segs.sort((x, y) => x.start - y.start);
  const laneEnd = [];
  for (const s of segs) { let l = laneEnd.findIndex(e => e <= s.start + 1e-6); if (l < 0) { l = laneEnd.length; laneEnd.push(0); } laneEnd[l] = s.end; s.lane = l; }
  const bars = segs.map(s => {
    const w = s.end - s.start, name = person(s.b.by).name;
    return `<button class="bar s-${s.b.stamm} ${s.b.status === "pending" ? "pend" : ""} ${s.ra ? "ra" : ""} ${s.rb ? "rb" : ""}" data-open="${s.b.id}"
      style="left:${s.start / 7 * 100}%;width:calc(${w / 7 * 100}% - ${s.rb ? 2 : 0}px);top:${s.lane * 29}px" aria-label="${esc(name)}, ${fmtRange(s.b.from, s.b.to)}">${w >= 1.4 ? esc(name) : ""}</button>`;
  }).join("");
  // Hochsaison: feine Linie an der Oberkante (Enden gerundet am Saisonanfang/-ende)
  let hsl = "", hrun = null;
  const hflush = endCol => {
    if (hrun == null) return;
    const a = !isHighSeason(addDays(cells[hrun], -1)), b = !isHighSeason(addDays(cells[endCol - 1], 1));
    hsl += `<span class="hsl-line ${a ? "a" : ""} ${b ? "b" : ""}" style="left:calc(${hrun / 7 * 100}% + ${a ? 4 : 0}px);width:calc(${(endCol - hrun) / 7 * 100}% - ${(a ? 4 : 0) + (b ? 4 : 0)}px)"></span>`;
    hrun = null;
  };
  cells.forEach((d, i) => { const h = d && isHighSeason(d); if (h && hrun == null) hrun = i; if (!h && hrun != null) hflush(i); });
  hflush(c1 + 1);
  // Schulferien: eine neutrale Linie (mind. ein Land frei), nicht in der Hochsaison – dort sind die Sommerferien ohnehin enthalten
  let fer = "", run = null;
  const flush = endCol => { if (run == null) return; fer += `<span class="fseg" style="left:calc(${run / 7 * 100}% + 10px);width:calc(${(endCol - run) / 7 * 100}% - 20px)"></span>`; run = null; };
  cells.forEach((d, i) => { const f = d && !isHighSeason(d) && ["NRW", "HE", "HH"].some(st => ferienOn(st, d)); if (f && run == null) run = i; if (!f && run != null) flush(i); });
  flush(c1 + 1);
  if (fer) fer = `<div class="fl">${fer}</div>`;
  return `<div class="wk">${hsl}<div class="cells">${days}</div>${hols ? `<div class="hols">${hols}</div>` : ""}
    <div class="bars ${hols ? "has-h" : ""}">${bars}</div><div class="fer">${fer}</div></div>`;
}
function updateCalHead() {
  const t = document.getElementById("cal-title"); if (!t) return;
  const [y, m] = MONTH_LIST[state.calIdx].split("-").map(Number);
  t.innerHTML = `${MONTHS[m - 1]} <span class="y">${y}</span>`;
  const sub = document.getElementById("cal-sub");
  if (sub) {
    const ym = MONTH_LIST[state.calIdx], hs = highSeason(y), mEnd = `${ym}-${p2(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;
    sub.innerHTML = hs.from <= mEnd && hs.to >= `${ym}-01` ? `<span class="hs-chip">${sunIcon()}Hochsaison</span>${dm(hs.from)}–${dm(hs.to)}` : "Tippe auf einen freien Tag";
  }
  const tb0 = document.querySelector(".today-btn");
  if (tb0) {
    const back = state.calIdx > TODAY_IDX; // today lies to the left
    tb0.classList.toggle("r", !back);
    tb0.querySelector(".ar").innerHTML = state.calIdx === TODAY_IDX ? "" : `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${back ? "M14 9H4M8.5 4.5 4 9l4.5 4.5" : "M4 9h10M9.5 4.5 14 9l-4.5 4.5"}"/></svg>`;
    tb0.setAttribute("aria-disabled", String(state.calIdx === TODAY_IDX));
  }
  const tb = document.querySelector(".today-btn"); if (tb) tb.classList.toggle("here", state.calIdx === TODAY_IDX);
}
let settleT;
function onPagerScroll() {
  const pg = pagerEl(); if (!pg) return;

/* ---------- Sheets ---------- */
const stack = [];
function openSheet(html, { onMount, onClose, label } = {}) {
  const layer = document.createElement("div");

  layer.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(layer); });

}

/* ---------- Booking detail ---------- */

  const tl = [`<li class="ok">${p.super ? "Gebucht" : "Angefragt"} von ${esc(p.name)}<small>${fmtWhen(b.createdAt)}</small></li>`];
  const apps = b.approvals && b.approvals.length ? b.approvals : (b.status === "confirmed" && b.decidedBy ? [{ by: b.decidedBy, at: b.decidedAt }] : []);
  for (const a of apps) tl.push(`<li class="ok">Freigegeben von ${esc(person(a.by).name)}<small>${fmtWhen(a.at)}</small></li>`);
  if (b.status === "pending") tl.push(`<li class="wait">Wartet auf ${awaitingText(b)}<small>${b.hs ? "Hochsaison: alle müssen zustimmen. " : ""}Verfällt in ${daysLeft(b)} ohne ${b.hs ? "alle Zusagen" : "Entscheidung"}</small></li>`);

  if (b.status === "cancelled") tl.push(`<li class="no">Storniert von ${esc(person(b.decidedBy).name)}<small>${fmtWhen(b.decidedAt)}</small></li>`);
  const actions = [];
  if (canApprove(u, b)) actions.push(`<button class="btn btn-ink btn-wide" data-approve="${b.id}">Freigeben</button>`);
  if (canReject(u, b)) actions.push(`<button class="btn btn-soft btn-wide" data-reject="${b.id}">Ablehnen</button>`);
  if (b.status === "pending" && b.by === u.id) {
    const txt = `Hallo ${awaiting(b).join(", hallo ")}, ich habe in der Casa-la-Paz-App ${fmtRange(b.from, b.to)} reserviert und bräuchte ${b.hs ? (awaiting(b).length > 1 ? "eure Freigaben (Hochsaison, alle müssen zustimmen)" : "noch deine Freigabe (Hochsaison)") : "eine Freigabe von einem von euch"}. Danke! ${p.name}${IS_LIVE ? "\n" + appUrl() : ""}`;
    actions.push(`<a class="btn btn-soft btn-wide" data-remind href="https://wa.me/?text=${encodeURIComponent(txt)}" data-text="${esc(txt)}" target="_blank" rel="noopener">Per WhatsApp erinnern</a>`);
  }
  if (canCancel(u, b, TODAY)) actions.push(`<button class="btn btn-danger btn-wide" data-cancel="${b.id}">Stornieren</button>`);
  openSheet(`<div class="s-${b.stamm}">
      <div class="sheet-title">${statusChip(b)}<button class="x-btn" data-close aria-label="Schließen">${xIcon}</button></div>
      <h2 style="margin-top:12px">${fmtRange(b.from, b.to)}</h2>
      <div class="band ${b.status === "pending" ? "pend" : ""}"></div>
      <div class="kv"><span>Wer</span><span>${esc(partyLine(b))}</span></div>
      <div class="kv"><span>Familie</span><span>${STAMM_NAME[b.stamm]}s Familie</span></div>
      <div class="kv"><span>Dauer</span><span class="num">${nights(n)}</span></div>
      ${b.hs ? `<div class="kv"><span>Saison</span><span><span class="hs-chip">${sunIcon()}Hochsaison</span></span></div>` : ""}
      ${isActive(b) ? `<div class="kv"><span>Kostenpflichtig</span><span class="num">${paid ? `${nights(paid)}, ${eur(paid * RATE)}` : "keine, Freinächte"}</span></div>` : ""}
      ${b.note ? `<div class="kv"><span>Notiz</span><span>${esc(b.note)}</span></div>` : ""}
      <ul class="timeline">${tl.join("")}</ul>
      ${actions.length ? `<div class="actions">${actions.join("")}</div>` : ""}
    </div>`, { label: "Aufenthalt" });
}

/* ---------- Decide / cancel ---------- */
function approve(id, btn) {
  if (btn && btn.classList.contains("busy")) return;
  busy(btn, true);
  api.decide(id, "approve", "").then(b => { haptic(); closeAll(); toast(b.status === "confirmed" ? `Freigegeben: ${person(b.by).name}, ${fmtRange(b.from, b.to)}` : `Deine Freigabe zählt. Es ${awaiting(b).length > 1 ? "fehlen" : "fehlt"} noch ${awaitingText(b)}.`); render(); })
    .catch(e => { busy(btn, false); afterError(e); });
}
function openReject(id) {
  const b = db.bookings.find(x => x.id === id);
  openSheet(`<div class="s-uli"><div class="sheet-title"><h2>Ablehnen</h2><button class="x-btn" data-close aria-label="Schließen">${xIcon}</button></div>
      <p class="muted" style="margin:8px 0 0">${esc(person(b.by).name)} sieht deine Begründung. Danach ist ${fmtRange(b.from, b.to)} wieder frei.</p>
      <div class="field-group"><textarea class="note" id="reject-reason" rows="4" placeholder="Warum geht es nicht?" aria-label="Begründung"></textarea></div>
      <div class="actions"><button class="btn btn-c btn-wide" data-act="do-reject" disabled>Ablehnen</button><button class="btn btn-soft btn-wide" data-close>Abbrechen</button></div></div>`,
    { label: "Ablehnen", onMount: (body) => {
      const ta = body.querySelector("textarea"), btn = body.querySelector('[data-act="do-reject"]');
      ta.addEventListener("input", () => { btn.disabled = ta.value.trim().length < 3; });
      btn.addEventListener("click", () => {
        if (btn.classList.contains("busy")) return;
        busy(btn, true);
        api.decide(id, "reject", ta.value).then(() => { ta.blur(); haptic(); closeAll(); toast("Abgelehnt"); render(); })
          .catch(err => { busy(btn, false); afterError(err); });
      });
      setTimeout(() => ta.focus(), 420);
    } });
}
function doCancel(btn, id) {
  if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Wirklich stornieren?"; haptic(); setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = "Stornieren"; } }, 3500); return; }
  if (btn.classList.contains("busy")) return;
  busy(btn, true);
  api.cancel(id).then(() => { haptic(); closeAll(); toast("Storniert"); render(); })
    .catch(e => { busy(btn, false); btn.dataset.armed = ""; afterError(e); });
}

/* ---------- Konto (Live) ---------- */
function openAccount() {
  const u = me();
  openSheet(`<div class="s-${u.stamm}"><div class="sheet-title"><h2>Konto</h2><button class="x-btn" data-close aria-label="Schließen">${xIcon}</button></div>
    <div class="acct"><span class="avatar">${initials(u.name)}</span><div><div class="acct-name">${esc(u.name)}</div>
      <div class="acct-role">${STAMM_NAME[u.stamm]}s Familie · ${u.super ? "bucht direkt, gibt frei" : "bucht mit Freigabe"}</div></div></div>
    <div class="acct-list">
      <div class="kv"><span>Angemeldet mit</span><span>${esc((sb.session && sb.session.email) || "")}</span></div>
      <div class="kv"><span>Stand</span><span>${lastSync ? fmtSync(lastSync) : "offline"}</span></div>
      <div class="kv"><span>Version</span><span class="num">${APP_VERSION}</span></div>
    </div>
    <div id="acct-notif">${acctNotifHTML()}</div>
    <div class="actions"><button class="btn btn-soft btn-wide" data-act="logout">Abmelden</button></div></div>`,
    { label: "Konto", onMount: (body, layer) => {
      body.addEventListener("click", e => {
        const on = e.target.closest('[data-act="notif-on"]'); if (on) { turnOnNotif(on); return; }
        const off = e.target.closest('[data-act="notif-off"]');
        if (off) {
          if (off.dataset.armed !== "1") { off.dataset.armed = "1"; off.textContent = "Wirklich ausschalten?"; haptic(); return; }
          haptic(); busy(off, true); notif.disable().then(() => { toast("Mitteilungen sind aus"); openAccountRefresh(); render(); });
          return;
        }
        const b = e.target.closest('[data-act="logout"]'); if (!b) return;
        if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Wirklich abmelden?"; haptic(); return; }
        haptic(); closeSheet(layer); signOut();
      });
    } });
}
/* Konto: Zeile „Mitteilungen“. Super-User: neue Anfragen. Alle: Entscheidung über die eigene Anfrage. */
function acctNotifHTML() {
  const st = notif.state(), n = openForMe(), sup = me().super;
  const label = { on: "An", off: "Aus", denied: "Am iPhone aus", browser: "Nur in der App", unsupported: "iOS zu alt", demo: "Vorschau" }[st];
  const hint = {
    on: sup ? `Du bekommst eine Mitteilung, sobald eine Anfrage auf deine Freigabe wartet. Der rote Zähler am App-Symbol zeigt, wie viele${n ? ` (gerade ${n})` : ""}.`
      : "Du bekommst eine Mitteilung, sobald deine Anfrage freigegeben ist (mit allen, die freigegeben haben) oder abgelehnt wurde.",
    off: sup ? "Mitteilung aufs iPhone und roter Zähler am App-Symbol, sobald jemand auf deine Freigabe wartet."
      : "Mitteilung aufs iPhone, sobald deine Anfrage freigegeben oder abgelehnt ist.",
    denied: "Einschalten unter Einstellungen › Mitteilungen › Casa la Paz › Mitteilungen erlauben, Kennzeichen an.",
    browser: "Mitteilungen gibt es nur, wenn du Casa la Paz über das Symbol auf dem Home-Bildschirm öffnest.",
    unsupported: "Mitteilungen brauchen iOS 16.4 oder neuer.",
    demo: "In der echten App fragt das iPhone hier einmal um Erlaubnis."
  }[st];
  const btn = st === "on" ? `<button class="btn btn-soft btn-wide" data-act="notif-off">Mitteilungen ausschalten</button>`
    : st === "off" || st === "demo" ? `<button class="btn btn-ink btn-wide" data-act="notif-on">Mitteilungen einschalten</button>` : "";
  return `<div class="acct-list" style="margin-top:0"><div class="kv" style="border-top:1px solid var(--line)"><span>Mitteilungen</span><span>${label}</span></div></div>
    <p class="notif-hint">${hint}</p>${btn ? `<div class="actions" style="margin-top:14px">${btn}</div>` : ""}`;
}
function openAccountRefresh() { const el = document.getElementById("acct-notif"); if (el) el.innerHTML = acctNotifHTML(); }
function fmtSync(ms) {
  const m = Math.round((Date.now() - ms) / 60e3);
  return m < 1 ? "gerade eben" : m === 1 ? "vor 1 Minute" : m < 60 ? `vor ${m} Minuten` : fmtWhen(ms);
}

/* ---------- Prototype role switch ---------- */
function openWho() {
  if (IS_LIVE) { openAccount(); return; }
  const u = me();
  const groups = STAMME.map(s => `<div class="who-stamm">${STAMM_NAME[s]}s Familie</div>` + PEOPLE.filter(p => p.stamm === s && !p.companion).map(p =>
    `<button class="who s-${p.stamm}" data-me="${p.id}" aria-current="${p.id === u.id}"><span class="avatar">${initials(p.name)}</span>
      <span><span class="who-name">${esc(p.name)}</span><br><span class="who-role">${p.super ? "Super-User, bucht direkt, gibt frei" : "Bucht mit Freigabe"}</span></span>
      <svg class="check" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 10.5 3.5 3.5 7.5-8"/></svg></button>`).join("")).join("");
  openSheet(`<div class="sheet-title"><h2>Ansicht als</h2><button class="x-btn" data-close aria-label="Schließen">${xIcon}</button></div>
    <p class="muted" style="margin:6px 0 0;font-size:15px">Im Prototyp kannst du jede Rolle ausprobieren. In der fertigen App meldet sich jede Person selbst an.</p>
    <div>${groups}</div>
    <div class="proto">Prototyp mit Testdaten. Die Buchungen 2026 stammen aus dem bisherigen Kalender, 2027 ist erfunden. Änderungen bleiben nur auf diesem Gerät.</div>
    <div class="actions"><button class="btn btn-soft btn-wide" data-act="reset">Testdaten zurücksetzen</button></div>`,
    { label: "Ansicht wechseln", onMount: (body, layer) => {
      body.addEventListener("click", e => {
        const w = e.target.closest("[data-me]");
        if (w) { db.me = w.dataset.me; save(); haptic(); closeSheet(layer); toast(`Ansicht: ${person(db.me).name}`); render(); }
        if (e.target.closest('[data-act="reset"]')) { db = { me: db.me, bookings: seed(nowMs()) }; save(); haptic(); closeSheet(layer); toast("Testdaten zurückgesetzt"); render(); }
      });
    } });
}

/* ---------- Global events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".layer") && !t.closest("[data-approve],[data-reject],[data-cancel],[data-remind]")) return; // sheets handle their own clicks
  const tab = t.closest(".tab"); if (tab) { haptic(); setTab(tab.dataset.tab); return; }
  const go = t.closest("[data-tab-go]"); if (go) { haptic(); setTab(go.dataset.tabGo, go.dataset.tabGo === "cal" ? { month: TODAY.slice(0, 7) } : {}); return; }
  const a = t.closest("[data-approve]"); if (a) { approve(a.dataset.approve, a); return; }
  const r = t.closest("[data-reject]"); if (r) { openReject(r.dataset.reject); return; }
  const c = t.closest("[data-cancel]"); if (c) { doCancel(c, c.dataset.cancel); return; }
  const o = t.closest("[data-open]"); if (o) { haptic(); openBooking(o.dataset.open); return; }
  const day = t.closest("[data-day]"); if (day) { onDay(day.dataset.day); return; }
  const nav = t.closest("[data-nav]"); if (nav) { haptic(); goIdx(state.calIdx + Number(nav.dataset.nav)); return; }
  const rm = t.closest("[data-remind]");
  if (rm && window.top === window.self && navigator.share) { e.preventDefault(); navigator.share({ text: rm.dataset.text }).catch(() => {}); return; }
  const act = t.closest("[data-act]"); if (!act) return;
  const k = act.dataset.act;
  if (k === "who") { haptic(); openWho(); }
  if (k === "year") { haptic(); openYear(); }
  if (k === "quota") { haptic(); openQuota(); }
  if (k === "today") { haptic(); goIdx(TODAY_IDX); }
  if (k === "sel-cancel") { haptic(); clearSel(); }
  if (k === "notif-on") turnOnNotif(act);
  if (k === "notif-later") { haptic(); notif.later(); const c = document.getElementById("notif-card"); if (c) c.remove(); toast("Geht jederzeit über dein Konto"); }
  if (k === "plan") {
    haptic();
    setTab("cal", { month: TODAY.slice(0, 7) });
    state.planning = true;
    bar("Wann möchtest du anreisen?", "Tippe auf den Anreisetag. Wische für spätere Monate.", "Abbrechen");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (stack.length) closeSheet(); else if (state.sel || state.planning) clearSel(); }
  if (state.tab === "cal" && !stack.length && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "")) goIdx(state.calIdx + (e.key === "ArrowRight" ? 1 : -1));
});

/* ---------- Anmeldung (Live) ---------- */
const loginEl = document.getElementById("login");
const MARK = `<div class="lg-mark"><div class="sp-name">Casa la Paz</div><div class="sp-sub">Vinaròs</div><div class="sp-line"><i class="s-micha"></i><i class="s-uli"></i><i class="s-fanny"></i></div></div>`;
let loginEmail = "", resendT = null;
function showLogin(step = "email", msg = "") {
  clearInterval(resendT);
  loginEl.hidden = false; loginEl.classList.remove("leave");
  if (step === "offline") {
    loginEl.innerHTML = `${MARK}<div class="lg-card lg-step"><h1>Keine Verbindung</h1><p class="lead">Die App braucht beim ersten Öffnen Internet. Prüfe WLAN oder mobile Daten.</p>
      <button class="btn btn-ink btn-wide" data-lg="retry">Erneut versuchen</button></div>`;
  } else if (step === "email") {
    loginEl.innerHTML = `${MARK}<form class="lg-card lg-step" data-lg="email-form" novalidate>
      <h1>Anmelden</h1><p class="lead">Gib deine E-Mail-Adresse ein. Du bekommst einen Code.</p>
      <input class="lg-input" type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="name@beispiel.de" aria-label="E-Mail-Adresse" value="${esc(loginEmail)}">
      <div data-err>${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>
      <button class="btn btn-ink btn-wide" type="submit">Code senden</button></form>
      <p class="lg-hint">Nur für die Familie. Du musst dich auf jedem Gerät nur einmal anmelden.</p>`;
  } else {
    loginEl.innerHTML = `${MARK}<form class="lg-card lg-step" data-lg="code-form" novalidate>
      <h1>Code eingeben</h1><p class="lead">Wir haben ihn an <b>${esc(loginEmail)}</b> geschickt.</p>
      <input class="lg-input lg-code" name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="······" aria-label="Code aus der E-Mail">
      <div data-err>${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>
      <button class="btn btn-ink btn-wide" type="submit">Anmelden</button>
      <div class="lg-links"><button type="button" class="lg-link" data-lg="other">Andere E-Mail</button><button type="button" class="lg-link" data-lg="resend" disabled>Neuer Code</button></div></form>
      <p class="lg-hint">Keine E-Mail da? Schau im Spam-Ordner nach.<br>Absender: Casa la Paz</p>`;
    let left = 60; const rs = loginEl.querySelector('[data-lg="resend"]');
    const tick = () => { if (!rs.isConnected) return clearInterval(resendT); rs.disabled = left > 0; rs.textContent = left > 0 ? `Neuer Code (${left})` : "Neuer Code"; left--; };
    tick(); resendT = setInterval(tick, 1000);
  }
  const inp = loginEl.querySelector("input");
  if (inp) setTimeout(() => inp.focus(), 350);
}
function lgError(msg) { const el = loginEl.querySelector("[data-err]"); if (el) el.innerHTML = `<div class="err">${esc(msg)}</div>`; }
async function sendCode(btn) {
  busy(btn, true, "Wird gesendet …");
  try { await sb.open("/auth/v1/otp", { email: loginEmail, create_user: true }); showLogin("code"); }
  catch (e) { busy(btn, false); lgError(e.message); }
}
async function verifyCode(code, btn) {
  busy(btn, true, "Wird geprüft …");
  try {
    const d = await sb.open("/auth/v1/verify", { type: "email", email: loginEmail, token: code });
    sb.store(sb.pick(d));
    await sync();
    enterApp();
  } catch (e) {
    busy(btn, false);
    if (e.member === false) { sb.store(null); showLogin("email", e.message); return; }
    lgError(e.message);
    const inp = loginEl.querySelector("input"); if (inp) { inp.value = ""; inp.focus(); }
  }
}
loginEl.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type="submit"]');
  if (btn.classList.contains("busy")) return;
  if (f.dataset.lg === "email-form") {
    loginEmail = f.email.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginEmail)) { lgError("Diese E-Mail-Adresse sieht nicht richtig aus."); return; }
    sendCode(btn);
  } else {
    const code = f.code.value.replace(/\D/g, "");
    if (code.length < 6) { lgError("Der Code hat 6 Ziffern."); return; }
    verifyCode(code, btn);
  }
});
loginEl.addEventListener("input", e => {
  if (e.target.name !== "code") return;
  e.target.value = e.target.value.replace(/\D/g, "");
  if (e.target.value.length === 6) { const btn = loginEl.querySelector('[type="submit"]'); if (!btn.classList.contains("busy")) verifyCode(e.target.value, btn); }
});
loginEl.addEventListener("click", e => {
  const k = e.target.closest("[data-lg]"); if (!k || k.tagName === "FORM") return;
  const a = k.dataset.lg;
  if (a === "other") showLogin("email");
  if (a === "resend" && !k.disabled) { k.disabled = true; sb.open("/auth/v1/otp", { email: loginEmail, create_user: true }).then(() => { toast("Neuer Code ist unterwegs"); showLogin("code"); }).catch(err => lgError(err.message)); }
  if (a === "retry") { busy(k, true, "Verbinde …"); start().catch(() => "offline").then(route); }
});
function enterApp() {
  setTab(({ "#kalender": "cal", "#anfragen": "req", "#uebersicht": "home" })[location.hash] || "home");
  notif.init();
  rt.start();
  if (!loginEl.hidden) {
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    loginEl.classList.add("leave"); setTimeout(() => { loginEl.hidden = true; loginEl.innerHTML = ""; }, 500);
    haptic();
  }
}
function signedOut(msg) { rt.stop(); lastSig = ""; sb.store(null); ls.set(CACHE_KEY, ""); closeAll(); showLogin("email", msg || ""); }
async function signOut() {
  if (notif.subscribed) await Promise.race([notif.disable(), new Promise(r => setTimeout(r, 2500))]);
  else if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
  notif.started = false;
  const s = sb.session;
  if (s) sb.raw("/auth/v1/logout", "POST", {}, s.access_token).catch(() => {});
  signedOut("");
}

/* Neue Version auf dem Server? Dann einmal frisch laden (gegen veraltete Zwischenspeicher). */
async function checkVersion() {
  if (!IS_LIVE) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const v = (await r.json()).version;
    if (v && v !== APP_VERSION && sessionStorage.getItem("casa-reload") !== v) {
      sessionStorage.setItem("casa-reload", v);
      location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { rt.stop(); return; }   // iOS trennt im Hintergrund ohnehin
  if (todayISO() !== TODAY) { location.reload(); return; }   // über Nacht offen gelassen
  checkVersion();
  if (IS_LIVE && sb.session) { syncQuiet(); rt.start(); }
});
addEventListener("online", () => { if (IS_LIVE && sb.session) { syncQuiet(); rt.retry = 0; rt.stop(); rt.start(); } });

/* ---------- Boot ---------- */
function route(res) {
  const [where, msg] = Array.isArray(res) ? res : [res, ""];
  if (where === "app") enterApp(); else showLogin(where === "offline" ? "offline" : "email", msg);
}
async function start() {
  if (!IS_LIVE) { load(); return "app"; }
  checkVersion();
  if (!sb.load()) return "login";
  const cache = readCache();
  if (cache) { applyData(cache); lastSync = cache.at || 0; syncQuiet(); return "app"; }
  try { await sync(); return "app"; }
  catch (e) {
    if (e.offline) return "offline";
    sb.store(null); return e.member === false ? ["login", e.message] : "login";
  }
}
(async () => {
  const sp = document.getElementById("splash");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced) requestAnimationFrame(() => requestAnimationFrame(() => sp.classList.add("in")));
  const [res] = await Promise.all([start().catch(() => "offline"), new Promise(r => setTimeout(r, reduced ? 0 : 1900))]);
  route(res);
  const done = () => { sp.remove(); document.body.classList.remove("booting", "reveal"); };
  if (reduced) { done(); return; }
  sp.classList.add("out"); document.body.classList.add("reveal");
  setTimeout(done, 1100);
})();
})();
</script>
